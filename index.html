        body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; padding-bottom: 40px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; margin-top: 10px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }

        .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .ai-badge { background: #7c3aed; color: white; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .ai-btn { background: #4c1d95; border: 1px solid #6d28d9; color: #e9d5ff; padding: 3px 8px; border-radius: 8px; font-size: 10px; cursor: pointer; font-weight: 600; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .stat-val { font-size: 22px; font-weight: 800; color: white; margin: 2px 0; }
        .stat-lbl { font-size: 11px; color: var(--text-dim); }

        .water-btn-group { display: flex; gap: 6px; width: 100%; margin-top: 8px; }
        .water-btn { flex: 1; padding: 6px; background: #1e293b; border: 1px solid var(--card-border); color: #38bdf8; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; transition: all 0.2s; position: relative; }
        .task-card.locked { opacity: 0.4; pointer-events: none; filter: grayscale(1); }
        .task-card.completed { opacity: 0.5; text-decoration: line-through; }
        
        .task-header { display: flex; align-items: center; gap: 12px; }
        .checkbox { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .task-card.completed .checkbox { background: var(--green); border-color: var(--green); }
        .checkbox::after { content: '✓'; color: white; font-weight: bold; display: none; font-size: 14px; }
        .task-card.completed .checkbox::after { display: block; }
        
        .task-title-group { flex: 1; }
        .task-title { font-size: 14px; font-weight: 700; color: #f3f4f6; }
        .task-tags { display: flex; gap: 6px; margin-top: 4px; }
        .task-tag { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #242f4d; color: #93c5fd; font-weight: 600; }
        .task-duration { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #312e81; color: #c7d2fe; font-weight: 700; }

        .task-sub-info { color: #f59e0b; margin-top: 4px; font-size: 10.5px; }

        .timer-btn { background: #0284c7; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }

            ],
            pazar: [
                { id: "spz1", title: "1. Aktif Dinlenme Yürüyüşü", duration: "15 Dk", seconds: 900, tag: "Kan Dolaşımı", details: "Çok hafif tempoda ev/dışarı yürüyüşü.", alt: "Amaç: Yorulmadan dolaşım sağlamak.", rest: "Dinlenme: Yok" },
                { id: "spz2", title: "2. Yoga & Derin Esneme", duration: "15 Dk", seconds: 900, tag: "Yenilenme", details: "Tüm vücudu rahatlatma hareketleri.", alt: "Püf Nokta: Kasları yeni haftaya hazırla.", rest: "Dinlenme: Tamamlandı!" }
            ]
        };

        let currentDay = "pazartesi";
        let currentTab = "beslenme";
        let activeTimers = {};

        function checkAutoReset() {
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
            const lastDate = localStorage.getItem("last_active_date");
            const dayIndex = now.getDay();
            const dayKeys = ["pazar", "pazartesi", "sali", "carsamba", "persembe", "cuma", "cumartesi"];
            
            if (lastDate !== todayStr) {
                localStorage.setItem("water_amount", "0");
                localStorage.setItem("last_active_date", todayStr);
                currentDay = dayKeys[dayIndex];
                document.getElementById("daySelect").value = currentDay;
            }
        }

        function init() {
            checkAutoReset();
            const now = new Date();
            const dayKeys = ["pazar", "pazartesi", "sali", "carsamba", "persembe", "cuma", "cumartesi"];
            currentDay = dayKeys[now.getDay()];
            document.getElementById("daySelect").value = currentDay;

            renderApp();
            updateWaterUI();

            setInterval(() => {
                const checkNow = new Date();
                const checkTodayStr = `${checkNow.getFullYear()}-${checkNow.getMonth() + 1}-${checkNow.getDate()}`;
                if (localStorage.getItem("last_active_date") !== checkTodayStr) {
                    checkAutoReset();
                    renderApp();
                    updateWaterUI();
                }
            }, 20000);
        }

        function generateAiTip() {
            const tips = aiPrompts[currentTab];
            const randomTip = tips[Math.floor(Math.random() * tips.length)];
            document.getElementById("aiTip").innerText = randomTip;
        }

        function changeDay() {
            currentDay = document.getElementById("daySelect").value;
            renderApp();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById("tabBeslenme").classList.toggle("active", tab === 'beslenme');
            document.getElementById("tabSpor").classList.toggle("active", tab === 'spor');
            renderApp();
        }

        function renderApp() {
            generateAiTip();
            const listEl = document.getElementById("taskList");
            listEl.innerHTML = "";
            
            const activeTasks = currentTab === 'beslenme' ? dietRoutines[currentDay] : sportRoutines[currentDay];
            let completedCount = 0;
            let previousCompleted = true; // İlk hareket açık başlar

            activeTasks.forEach((task, index) => {
                const key = `task_${currentDay}_${currentTab}_${task.id}`;
                const isDone = localStorage.getItem(key) === "true";
                if (isDone) completedCount++;

                // Spor sekmesinde sıralı açılma kuralı
                const isLocked = currentTab === 'spor' && !previousCompleted && !isDone;

                const card = document.createElement("div");
                card.className = `task-card ${isDone ? 'completed' : ''} ${isLocked ? 'locked' : ''}`;
                
                let timerHtml = "";
                if (currentTab === 'spor' && task.seconds) {
                    timerHtml = `
                        <div class="timer-box">
                            <span class="timer-val" id="timer_${task.id}">${formatTime(task.seconds)}</span>
                            <button class="timer-btn" onclick="event.stopPropagation(); startTimer('${task.id}', ${task.seconds})">▶️ Kronometre Başlat</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="task-header" onclick="toggleTask('${key}')">
                        <div class="checkbox"></div>
                        <div class="task-title-group">
                            <div class="task-title">${isLocked ? '🔒 ' : ''}${task.title}</div>
                            <div class="task-tags">
                                <span class="task-tag">${task.tag}</span>
                                <span class="task-duration">⏱️ ${task.duration}</span>
                            </div>
                        </div>
                    </div>
                    <div class="task-details">
                        <strong>Ayrıntı:</strong> ${task.details}<br>
                        <div class="task-sub-info">💡 <strong>Püf Nokta / Alternatif:</strong> ${task.alt}</div>
                        ${task.rest ? `<div style="color:#60a5fa; margin-top:2px;">🔄 <strong>Dinlenme:</strong> ${task.rest}</div>` : ''}
                    </div>
                    ${timerHtml}
                `;
                
                listEl.appendChild(card);
                previousCompleted = isDone; // Sonraki kart için kilit durumunu güncelle
            });

            const pct = Math.round((completedCount / activeTasks.length) * 100) || 0;
            document.getElementById("progressPct").innerText = `%${pct}`;
        }

        function toggleTask(key) {
            const val = localStorage.getItem(key) === "true";
            localStorage.setItem(key, !val);
            renderApp();
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function startTimer(id, totalSec) {
            if (activeTimers[id]) clearInterval(activeTimers[id]);
            let currentSec = totalSec;
            const timerEl = document.getElementById(`timer_${id}`);
            
            activeTimers[id] = setInterval(() => {
                currentSec--;
                if (timerEl) timerEl.innerText = formatTime(currentSec);
                if (currentSec <= 0) {
                    clearInterval(activeTimers[id]);
                    if (timerEl) timerEl.innerText = "SÜRE BİTTİ! 💪";
                }
            }, 1000);
        }

        function addWater(amount) {
            let curr = parseFloat(localStorage.getItem("water_amount") || "0");
            curr = Math.min(4.0, curr + amount);
            localStorage.setItem("water_amount", curr.toFixed(1));
            updateWaterUI();
        }

        function updateWaterUI() {
            const curr = parseFloat(localStorage.getItem("water_amount") || "0");
            document.getElementById("waterVal").innerText = `${curr.toFixed(1)} / 4.0 L`;
        }

        function resetCurrentDay() {
            if (confirm("Bu günün verilerini sıfırlamak istiyor musun?")) {
                const activeTasks = currentTab === 'beslenme' ? dietRoutines[currentDay] : sportRoutines[currentDay];
                activeTasks.forEach(task => {
                    localStorage.removeItem(`task_${currentDay}_${currentTab}_${task.id}`);
                });
                localStorage.setItem("water_amount", "0");
                updateWaterUI();
                renderApp();
            }
        }

        init();
    </script>
</body>
</html>
